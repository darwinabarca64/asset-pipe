[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-pipe"
version = "1.0.0"
description = "Automated Financial & Asset Reconciliation Pipeline (Polars Rust, AWS S3 Parquet, Pydantic v2, Dual DuckDB/Snowflake FinOps)"
authors = [
    { name = "Darwin Miguel Abarca Vargas" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.7.0",
    "duckdb>=1.0.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "snowflake-connector-python>=3.10.0",
    "cryptography>=42.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/python"]
filterwarnings = [
    "ignore::pytest.PytestRemovedIn10Warning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["UP042"]
